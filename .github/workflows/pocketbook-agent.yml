name: PocketBook agent

on:
  push:
    branches: [main]
    tags: ['pocketbook-agent-v*']
    paths: ['pocketbook-agent/**', '.github/workflows/pocketbook-agent.yml']
  pull_request:
    paths: ['pocketbook-agent/**', '.github/workflows/pocketbook-agent.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test
        working-directory: pocketbook-agent
        run: sudo apt-get install -y libcurl4-openssl-dev && make test
      - name: Fetch SDK (B288, firmware 6.x)
        run: git clone --depth 1 --branch 6.5 https://github.com/pocketbook/SDK_6.3.0.git "$RUNNER_TEMP/sdk"
      - name: Cross-compile
        working-directory: pocketbook-agent
        # The SDK's gcc 6.3 links libmpfr.so.4; Ubuntu ships the ABI-compatible .so.6.
        run: |
          mkdir -p "$RUNNER_TEMP/compat"
          ln -sf "$(ls /usr/lib/x86_64-linux-gnu/libmpfr.so.6* | head -1)" "$RUNNER_TEMP/compat/libmpfr.so.4"
          export LD_LIBRARY_PATH="$RUNNER_TEMP/compat"
          make SDK="$RUNNER_TEMP/sdk/SDK-B288"
          file usage-agent.app
      - uses: actions/upload-artifact@v7
        with:
          name: usage-agent-pocketbook
          path: pocketbook-agent/usage-agent.app
      - name: Release
        if: startsWith(github.ref, 'refs/tags/pocketbook-agent-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" pocketbook-agent/usage-agent.app --title "PocketBook usage-agent ${GITHUB_REF_NAME#pocketbook-agent-v}" --generate-notes
