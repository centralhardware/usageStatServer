[package]
name = "usage-agent"
version = "0.1.0"
edition = "2024"
description = "macOS LaunchAgent that reports app usage to UsageStatServer"

[dependencies]
usage-model = { path = "../model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
ureq = { version = "3", default-features = false, features = ["json", "native-tls"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSWorkspace", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSURL", "NSString"] }

[profile.release]
strip = true
lto = true
